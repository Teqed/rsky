[workspace]
members = ["."]

[package]
name = "rsky-pdsadmin"
version = "0.1.0"
edition = "2024"
description = "Administrative CLI tool for rsky-pds"
authors = ["RSKY Team"]
license = "MIT"

[lib]
name = "rsky_pdsadmin"
path = "src/lib.rs"

[[bin]]
name = "pdsadmin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive", "env"] }
dialoguer = "0.11"
diesel = { version = "2.2.10", features = ["postgres"] }
diesel_migrations = { version = "2.1.0", features = ["postgres"] }
dotenv = "0.15"
rand = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
which = "5.0"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.9"

[features]
default = []
db_cli = ["diesel_cli"]
